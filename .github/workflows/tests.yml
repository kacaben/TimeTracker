name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      TZ: Europe/Prague   # a time zone with daylight saving, so the DST test runs (Linux honours TZ)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
