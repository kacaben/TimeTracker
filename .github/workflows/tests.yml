name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # A time zone with daylight saving, so the DST test runs. Only Linux understands
      # IANA names in TZ; on Windows Python would misread it, so Windows keeps its default.
      - if: runner.os == 'Linux'
        run: echo "TZ=Europe/Prague" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
